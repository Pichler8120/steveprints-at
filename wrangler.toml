# Cloudflare Pages Konfiguration für StevePrints
name = "steveprints-at"
type = "javascript"
compatibility_date = "2024-12-02"

# Production Environment mit Custom Domains
[env.production]
routes = [
  { pattern = "steveprints.at", zone_name = "steveprints.at" },
  { pattern = "www.steveprints.at", zone_name = "steveprints.at" }
]

# Pages deployment config
pages_build_output_dir = "."
